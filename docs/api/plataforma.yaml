openapi: 3.1.0
info:
  title: Identidade e estado comercial SaaS — contrato parcial
  version: 0.2.0
servers:
  - url: https://plataforma.localhost:8089/api/v1/plataforma
paths:
  /auth/csrf:
    get:
      summary: Obter CSRF mascarado vinculado ao cookie exclusivo SaaS
      responses:
        '200':
          description: token e headerName; cookie __Host-RM_PLATFORM_CSRF Secure/HttpOnly/Strict
        '404':
          description: Origem diferente da configurada ou domínio empresarial
  /auth/login:
    post:
      summary: Autenticar operador cadastrado de forma assistida
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, senha]
              properties:
                email: {type: string, format: email, maxLength: 254}
                senha: {type: string, minLength: 1, maxLength: 72, writeOnly: true}
      responses:
        '200':
          description: Access JWT de 300 segundos, expiresIn e refresh exclusivo em cookie HttpOnly/Secure/Strict
        '400': {description: Campos inválidos ou desconhecidos}
        '401': {description: Credencial inválida ou conta inativa; sem enumeração}
        '403': {description: CSRF inválido ou ausente}
        '429': {description: Cinco tentativas por e-mail ou cem por origem em quinze minutos}
  /auth/refresh:
    post:
      summary: Rotacionar refresh; replay revoga a família, mesmo com access válido
      security:
        - csrf: []
          refresh: []
      responses:
        '200': {description: Novo access e cookie; prazo absoluto de doze horas não é renovado}
        '401': {description: Refresh inválido, consumido, sessão expirada/revogada ou operador inativo}
        '403': {description: CSRF obrigatório mesmo com Bearer}
  /auth/logout:
    post:
      summary: Revogar sessão no servidor e expirar cookie
      security:
        - csrf: []
          refresh: []
      responses:
        '204': {description: Sessão revogada}
        '401': {description: Refresh ausente ou inválido}
        '403': {description: CSRF inválido}
  /auth/me:
    get:
      summary: Identidade SaaS atual, sem contexto empresarial
      security:
        - bearer: []
      responses:
        '200': {description: usuarioId, sessaoId e perfil OPERADOR_SAAS}
        '401': {description: JWT ou sessão inválida; audiência empresarial não é aceita}
  /auth/reautenticar:
    post:
      summary: Confirmar senha na sessão SaaS por cinco minutos, sem renovar sua expiração absoluta
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [senha]
              properties:
                senha: {type: string, minLength: 1, maxLength: 72, writeOnly: true}
      responses:
        '204': {description: Confirmação registrada na sessão atual}
        '400': {description: Entrada inválida ou campo desconhecido}
        '401': {description: Bearer SaaS ou sessão inválidos; cookies não autenticam esta ação}
        '422': {description: Senha incorreta; login permanece válido}
        '429': {description: Cinco tentativas por operador em quinze minutos}
  /empresas/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Consultar metadados e versão atual para reconciliar resposta incerta
      security:
        - bearer: []
      responses:
        '200':
          description: Mesmo formato da empresa retornada na listagem
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Empresa'}
        '401': {description: Identidade SaaS inválida}
        '404': {description: Empresa não encontrada}
  /empresas/{id}/estado:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    put:
      summary: Suspender ou reativar empresa completa, com versão e auditoria atômica
      description: Não revoga sessões empresariais nem concede acesso aos dados do restaurante. Não ativa PROVISIONANDO/FALHOU. Em resposta perdida consultar por UUID antes de nova decisão; replay da versão antiga retorna 409, nunca duplica efeito.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versao, estado, motivo]
              properties:
                versao: {type: integer, minimum: 0}
                estado: {type: string, enum: [ATIVO, SUSPENSO]}
                motivo: {type: string, minLength: 1, maxLength: 240, description: Não vazio; sem caracteres de controle}
      responses:
        '200':
          description: Estado atual e versão incrementada; auditoria confirmada na mesma transação
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Empresa'}
        '400': {description: Entrada inválida ou desconhecida}
        '401': {description: Identidade SaaS inválida}
        '403': {description: Confirmação recente da senha obrigatória}
        '404': {description: Empresa não encontrada}
        '409': {description: Versão divergente, estado incompleto ou nenhuma transição; consultar antes de nova decisão}
  /empresas:
    get:
      summary: Listar somente metadados empresariais, em ordem estável de UUID
      security:
        - bearer: []
      parameters:
        - in: query
          name: pagina
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: Até cinquenta empresas; não contém schema, credenciais, clientes ou consumo
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: {$ref: '#/components/schemas/Empresa'}
        '400': {description: Página inválida}
        '401': {description: Autenticação SaaS obrigatória}
components:
  schemas:
    Empresa:
      type: object
      additionalProperties: false
      required: [id, nome, estado, versao, dominios]
      properties:
        id: {type: string, format: uuid}
        nome: {type: string}
        estado: {type: string, enum: [PROVISIONANDO, ATIVO, FALHOU, SUSPENSO]}
        versao: {type: integer}
        dominios: {type: array, items: {type: string}}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Audiência única restaurant-manager-plataforma; sem claim tenant
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Token mascarado obtido em auth/csrf; cookie correspondente também obrigatório
    refresh:
      type: apiKey
      in: cookie
      name: RM_PLATFORM_REFRESH
      description: Host-only, path /api/v1/plataforma/auth, HttpOnly, Secure e SameSite Strict
