<section class="painel-financeiro">
  <h2 class="sr-only">Pendências financeiras e notificações</h2>
  <nav aria-label="Filas operacionais" class="abas">
    <button
      type="button"
      [attr.aria-pressed]="aba() === 'pagamentos'"
      (click)="aba.set('pagamentos')"
    >
      Pendências financeiras
    </button>
    <button
      type="button"
      [attr.aria-pressed]="aba() === 'notificacoes'"
      (click)="aba.set('notificacoes')"
    >
      Notificações por e-mail
    </button>
  </nav>
  <div [hidden]="aba() !== 'pagamentos'">
    <app-fila-operacional
      fila="pagamentos"
      [ativa]="aba() === 'pagamentos'"
      [unidadeId]="unidadeId()"
    />
  </div>
  <div [hidden]="aba() !== 'notificacoes'">
    <app-fila-operacional
      fila="notificacoes"
      [ativa]="aba() === 'notificacoes'"
      [unidadeId]="unidadeId()"
    />
  </div>
</section>
