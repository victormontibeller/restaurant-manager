<section class="painel-pendencias" aria-labelledby="pendencias-titulo">
  <h2 id="pendencias-titulo" class="sr-only">Pendências financeiras e notificações</h2>
  <nav class="pendencias-barra-topo" aria-label="Filas operacionais">
    <button type="button" (click)="financeiras.focus()">Pendências financeiras</button>
    <button type="button" (click)="notificacoes.focus()">Notificações por e-mail</button>
  </nav>
  <div class="grade-pendencias">
    <div tabindex="-1" #financeiras>
      <app-fila-operacional fila="pagamentos" [unidadeId]="unidadeId()" />
    </div>
    <div tabindex="-1" #notificacoes>
      <app-fila-operacional fila="notificacoes" [unidadeId]="unidadeId()" />
    </div>
  </div>
</section>
