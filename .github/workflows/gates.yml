name: Fundacao
on:
  push:
    branches: ['hermes/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:

      MAVEN_OPTS: -Xmx384m -XX:ActiveProcessorCount=2
      NODE_OPTIONS: --max-old-space-size=768
      NG_BUILD_MAX_WORKERS: 2
    steps:
      - name: Diretorio temporario privado do runner
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: PostgreSQL real exclusivo
        run: python3 scripts/ci-database.py
      - name: Documentacao e segredos
        run: |
          python3 scripts/check-repository.py
          TMPDIR="$RUNNER_TEMP" python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Angular e dependencias
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run typecheck
          node scripts/test_platform_session.cjs
          node scripts/test_unit_events.cjs
          npm --prefix frontend run build
          npm --prefix frontend audit --audit-level=moderate
      - name: Backend e PostgreSQL
        run: bash backend/mvnw -B -ntp -f backend/pom.xml clean verify
      - name: Vulnerabilidades Java no artefato
        run: python3 scripts/audit-java.py
